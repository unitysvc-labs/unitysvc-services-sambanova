name: Populate Services

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  populate:
    uses: unitysvc-labs/.github/.github/workflows/seller-populate-services.yml@main
    secrets: inherit
    # Every service in this repo is a BYOK LLM service (customer's own key,
    # nothing billed by the platform), so the nightly PR is merged without
    # review once Validate Data and Format Check pass. Remove this if the repo
    # ever gains a managed or BYOE channel.
    with:
      auto_merge: true
    permissions:
      contents: write
      pull-requests: write
